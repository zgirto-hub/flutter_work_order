name: Deploy Flutter Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.2'

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.0

      - name: Setup Flutter
        run: |
          git config --global --add safe.directory C:/flutter
          git config --global --add safe.directory C:/flutter/bin/cache/dart-sdk
          if (!(Test-Path "C:\flutter")) { git clone https://github.com/flutter/flutter.git -b stable C:\flutter }
          C:\flutter\bin\flutter.bat config --no-analytics
          C:\flutter\bin\flutter.bat --version

      - name: Install dependencies
        working-directory: frontend
        run: C:\flutter\bin\flutter.bat pub get

      - name: Analyze code
        working-directory: frontend
        run: C:\flutter\bin\flutter.bat analyze --no-fatal-infos
        continue-on-error: true

      - name: Get version info
        id: version
        run: |
          $pubspec = Get-Content frontend/pubspec.yaml | Select-String "^version:"
          $versionLine = $pubspec.ToString().Replace("version: ", "")
          $newVersion = $versionLine.Split("+")[0]
          $buildNumber = $versionLine.Split("+")[1]
          $buildDate = Get-Date -Format "yyyy-MM-dd_HH-mm-ss"
          $releaseId = Get-Date -Format "yyyyMMddHHmmss"
          
          echo "version=$newVersion" >> $env:GITHUB_OUTPUT
          echo "build_number=$buildNumber" >> $env:GITHUB_OUTPUT
          echo "build_date=$buildDate" >> $env:GITHUB_OUTPUT
          echo "release_id=$releaseId" >> $env:GITHUB_OUTPUT

      - name: Build Flutter Web
        working-directory: frontend
        run: C:\flutter\bin\flutter.bat build web --dart-define=BUILD_DATE=${{ steps.version.outputs.build_date }} --dart-define=RELEASE_ID=${{ steps.version.outputs.release_id }}

      - name: Create release.json
        run: |
          @{
            version = "${{ steps.version.outputs.version }}"
            build = "${{ steps.version.outputs.build_number }}"
            release_id = "${{ steps.version.outputs.release_id }}"
            build_date = "${{ steps.version.outputs.build_date }}"
          } | ConvertTo-Json | Out-File -FilePath "frontend/build/web/release.json" -Encoding utf8

      - name: Deploy to server
        run: |
          $timestamp = Get-Date -Format "yyyyMMddHHmm"
          $newRelease = "/var/www/releases/release_$timestamp"
          ssh zorin@100.85.73.37 "mkdir -p $newRelease"
          scp -r "frontend/build/web/*" "zorin@100.85.73.37:$newRelease/"
          ssh zorin@100.85.73.37 "ln -sfn $newRelease /var/www/flutter_app"
          ssh zorin@100.85.73.37 "ls -dt /var/www/releases/release_* 2>/dev/null | tail -n +11 | xargs -r rm -rf"

      - name: Deployment summary
        run: |
          echo "## Deployment Complete" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Build**: ${{ steps.version.outputs.build_number }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Release ID**: ${{ steps.version.outputs.release_id }}" >> $env:GITHUB_STEP_SUMMARY
          echo "- **Server**: 100.85.73.37" >> $env:GITHUB_STEP_SUMMARY