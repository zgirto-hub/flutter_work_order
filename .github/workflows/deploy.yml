name: Deploy Flutter Web

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.2'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        timeout-minutes: 5
        working-directory: frontend
        run: flutter pub get

      - name: Create .env for build
        working-directory: frontend
        run: |
          cat <<EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL_PROD=${{ secrets.API_BASE_URL_PROD }}
          DOWNLOAD_URL_PROD=${{ secrets.DOWNLOAD_URL_PROD }}
          EOF

      - name: Clean build artifacts
        working-directory: frontend
        run: |
          rm -rf .dart_tool build

      - name: Analyze code
        working-directory: frontend
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Get version info
        id: version
        run: |
          VERSION_LINE=$(grep "^version:" frontend/pubspec.yaml | sed 's/version: //')
          VERSION=$(echo "$VERSION_LINE" | cut -d'+' -f1)
          BUILD_NUMBER=${{ github.run_number }}
          BUILD_DATE=$(date +"%Y-%m-%d_%H-%M-%S")
          RELEASE_ID=$(date +"%Y%m%d%H%M%S")

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT

      - name: Build Flutter Web
        timeout-minutes: 15
        working-directory: frontend
        run: flutter build web --dart-define=BUILD_DATE=${{ steps.version.outputs.build_date }} --dart-define=RELEASE_ID=${{ steps.version.outputs.release_id }}

      - name: Create release.json
        run: |
          cat <<EOF > frontend/build/web/release.json
          {
            "version": "${{ steps.version.outputs.version }}",
            "build": "${{ steps.version.outputs.build_number }}",
            "release_id": "${{ steps.version.outputs.release_id }}",
            "build_date": "${{ steps.version.outputs.build_date }}"
          }
          EOF

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 100.85.73.37 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to server
        timeout-minutes: 5
        run: |
          TIMESTAMP=$(date +"%Y%m%d%H%M")
          NEW_RELEASE="/var/www/releases/release_$TIMESTAMP"
          ssh -o ConnectTimeout=10 -o BatchMode=yes zorin@100.85.73.37 "mkdir -p $NEW_RELEASE"
          scp -o ConnectTimeout=10 -r frontend/build/web/* "zorin@100.85.73.37:$NEW_RELEASE/"
          ssh -o ConnectTimeout=10 -o BatchMode=yes zorin@100.85.73.37 "ln -sfn $NEW_RELEASE /var/www/flutter_app"
          ssh -o ConnectTimeout=10 -o BatchMode=yes zorin@100.85.73.37 "ls -dt /var/www/releases/release_* 2>/dev/null | tail -n +11 | xargs -r rm -rf"

      - name: Deployment summary
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: ${{ steps.version.outputs.build_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release ID**: ${{ steps.version.outputs.release_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Server**: 100.85.73.37" >> $GITHUB_STEP_SUMMARY
