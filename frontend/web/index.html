<!DOCTYPE html>
<html>
<head>
  <script src="webauthn.js"></script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "760f00e5-fb08-4c0c-b898-ea35737bcc21",
        notifyButton: { enable: false },
        allowLocalhostAsSecureOrigin: true,
        serviceWorkerPath: "OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/" },
      });
    });

    async function oneSignalRequestPermission() {
      return new Promise((resolve) => {
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            const result = await Notification.requestPermission();
            console.log("Notification permission result:", result);
            if (result === "granted") {
              await OneSignal.User.PushSubscription.optIn();
              console.log("OneSignal optIn done, id:", OneSignal.User.PushSubscription.id);
            }
            resolve(result === "granted");
          } catch(e) {
            console.error("Notification permission error:", e);
            resolve(false);
          }
        });
      });
    }

    async function oneSignalSubscribe(email, role) {
      return new Promise((resolve) => {
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            await OneSignal.login(email);
            await OneSignal.User.addTag("role", role);
            resolve(true);
          } catch(e) { resolve(false); }
        });
      });
    }

    async function oneSignalUnsubscribe() {
      return new Promise((resolve) => {
        OneSignalDeferred.push(async function(OneSignal) {
          try { await OneSignal.User.PushSubscription.optOut(); } catch(e) {}
          resolve();
        });
      });
    }
  </script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="work_order">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>work_order</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #FAF9F7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #loading-icon {
      width: 52px;
      height: 52px;
      background: #CC785C;
      border-radius: 13px;
      margin-bottom: 28px;
    }
    #loading-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 17px;
      font-weight: 600;
      color: #1A1915;
      letter-spacing: -0.2px;
      margin-bottom: 44px;
    }
    #loading-track {
      width: 160px;
      height: 3px;
      background: #ECEBE6;
      border-radius: 2px;
      overflow: hidden;
    }
    #loading-fill {
      height: 100%;
      width: 0%;
      background: #CC785C;
      border-radius: 2px;
      animation: loading-auto 9s ease-out forwards;
    }
    #loading-fill.complete {
      animation: none;
      width: 100% !important;
      transition: width 0.15s ease;
    }
    @keyframes loading-auto {
      0%   { width: 0%; }
      30%  { width: 55%; }
      60%  { width: 75%; }
      100% { width: 88%; }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div id="loading-icon"></div>
    <div id="loading-title">Work Order</div>
    <div id="loading-track">
      <div id="loading-fill"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var fill   = document.getElementById('loading-fill');
      var screen = document.getElementById('loading-screen');
      if (fill) fill.classList.add('complete');
      setTimeout(function() {
        if (screen) screen.classList.add('fade-out');
        setTimeout(function() {
          if (screen) screen.remove();
        }, 380);
      }, 180);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Called by Flutter's "Update now" button.
    // Nginx serves main.dart.js with no-cache, so a plain reload always gets the latest build.
    window.applyPWAUpdate = async function() {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(function(k) { return caches.delete(k); }));
      }
      window.location.reload();
    };
  </script>
</body>
</html>
