<!DOCTYPE html>
<html>
<head>
  <script src="webauthn.js"></script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "760f00e5-fb08-4c0c-b898-ea35737bcc21",
        notifyButton: { enable: false },
        allowLocalhostAsSecureOrigin: true,
        serviceWorkerPath: "OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/" },
      });
    });

    async function oneSignalRequestPermission() {
      return new Promise((resolve) => {
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            const result = await Notification.requestPermission();
            console.log("Notification permission result:", result);
            if (result === "granted") {
              await OneSignal.User.PushSubscription.optIn();
              console.log("OneSignal optIn done, id:", OneSignal.User.PushSubscription.id);
            }
            resolve(result === "granted");
          } catch(e) {
            console.error("Notification permission error:", e);
            resolve(false);
          }
        });
      });
    }

    async function oneSignalSubscribe(email, role) {
      return new Promise((resolve) => {
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            await OneSignal.login(email);
            await OneSignal.User.addTag("role", role);
            resolve(true);
          } catch(e) { resolve(false); }
        });
      });
    }

    async function oneSignalUnsubscribe() {
      return new Promise((resolve) => {
        OneSignalDeferred.push(async function(OneSignal) {
          try { await OneSignal.User.PushSubscription.optOut(); } catch(e) {}
          resolve();
        });
      });
    }

    // App icon badge (Web App Badging API — works on installed PWA)
    function setAppBadge(count) {
      if (!('setAppBadge' in navigator)) return;
      if (count > 0) {
        navigator.setAppBadge(count).catch(function(e) {
          console.warn('setAppBadge failed:', e);
        });
      } else {
        navigator.clearAppBadge().catch(function(e) {
          console.warn('clearAppBadge failed:', e);
        });
      }
    }

    // Set badge when a OneSignal notification arrives (foreground)
    OneSignalDeferred.push(function(OneSignal) {
      OneSignal.Notifications.addEventListener('foregroundWillDisplay', function(event) {
        event.notification.display(); // required — without this OneSignal suppresses the notification
        if ('setAppBadge' in navigator) {
          navigator.setAppBadge().catch(function() {});
        }
      });
    });
  </script>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Work Order management app">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Work Order">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Work Order</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #FAF9F7; }

    #loading-screen {
      position: fixed;
      inset: 0;
      background: #FAF9F7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      animation: splash-enter 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.08s;
      transition: opacity 0.4s ease;
    }
    #loading-screen.fade-out {
      opacity: 0 !important;
      animation: none;
      pointer-events: none;
    }
    @keyframes splash-enter {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Logo container ── */
    #loading-logo-wrap {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, #DA8C6A 0%, #AF5335 100%);
      box-shadow: 0 10px 28px rgba(204, 120, 92, 0.38);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      animation: logo-breathe 2.8s ease-in-out infinite 0.7s;
    }
    @keyframes logo-breathe {
      0%,100% { box-shadow: 0 10px 28px rgba(204,120,92,0.38); transform: scale(1); }
      50%     { box-shadow: 0 16px 40px rgba(204,120,92,0.52); transform: scale(1.04); }
    }

    /* ── Text ── */
    #loading-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: #1A1915;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }
    #loading-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      font-size: 13px;
      color: #9A9990;
      letter-spacing: 0.1px;
      margin-bottom: 52px;
    }

    /* ── Progress bar ── */
    #loading-track {
      width: 140px;
      height: 2.5px;
      background: #E8E7E0;
      border-radius: 2px;
      overflow: hidden;
    }
    #loading-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #CC785C, #DA8C6A);
      border-radius: 2px;
      animation: loading-auto 9s ease-out forwards;
    }
    #loading-fill.complete {
      animation: none;
      width: 100% !important;
      transition: width 0.15s ease;
    }
    @keyframes loading-auto {
      0%   { width: 0%; }
      30%  { width: 55%; }
      60%  { width: 75%; }
      100% { width: 88%; }
    }
  </style>
</head>
<body>
  <div id="loading-screen">

    <!-- Logo: gradient container + triskelion mark (matches login screen) -->
    <div id="loading-logo-wrap">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(24,24)" fill="white" opacity="0.92">
          <!-- pill 0° -->
          <rect x="-4.92" y="-17.52" width="9.84" height="22.08" rx="4.94"/>
          <!-- pill 120° -->
          <rect x="-4.92" y="-17.52" width="9.84" height="22.08" rx="4.94" transform="rotate(120)"/>
          <!-- pill 240° -->
          <rect x="-4.92" y="-17.52" width="9.84" height="22.08" rx="4.94" transform="rotate(240)"/>
        </g>
      </svg>
    </div>

    <div id="loading-title">Work Order</div>
    <div id="loading-subtitle">Please wait…</div>

    <div id="loading-track">
      <div id="loading-fill"></div>
    </div>

  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var fill   = document.getElementById('loading-fill');
      var screen = document.getElementById('loading-screen');
      if (fill) fill.classList.add('complete');
      setTimeout(function() {
        if (screen) screen.classList.add('fade-out');
        setTimeout(function() {
          if (screen) screen.remove();
        }, 380);
      }, 180);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Called by Flutter's "Update now" button.
    // Nginx serves main.dart.js with no-cache, so a plain reload always gets the latest build.
    window.applyPWAUpdate = async function() {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(function(k) { return caches.delete(k); }));
      }
      window.location.reload();
    };
  </script>
</body>
</html>
