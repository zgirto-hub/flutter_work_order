<!DOCTYPE html>
<html>
<head>
  <script src="webauthn.js" defer></script>

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Work Order management app">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Work Order">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="alternate icon" type="image/png" href="favicon.png"/>

  <title>Work Order</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiempos+Headline:wght@400;500&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiempos+Headline:wght@400;500&family=Inter:wght@400;500;600&display=swap"></noscript>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    /* Light mode (Claude.ai style) */
    :root {
      --bg-primary: #f4ede4;
      --bg-secondary: #eee5da;
      --surface: #ffffff;
      --surface-secondary: #faf8f5;
      --border: rgba(0, 0, 0, 0.08);
      --text-primary: #2d2019;
      --text-secondary: #6b5d52;
      --text-tertiary: #9d8b7e;
      --accent: #cc785c;
      --accent-hover: #b86a4f;
      --accent-light: rgba(204, 120, 92, 0.1);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08);
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1a1614;
        --bg-secondary: #221e1b;
        --surface: #2d2825;
        --surface-secondary: #251f1c;
        --border: rgba(255, 255, 255, 0.1);
        --text-primary: #f4ede4;
        --text-secondary: #c9bbb0;
        --text-tertiary: #9d8b7e;
        --accent: #d88568;
        --accent-hover: #e69578;
        --accent-light: rgba(216, 133, 104, 0.15);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
        --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
      }
    }

    body { 
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Subtle texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(circle at 20% 30%, var(--bg-secondary) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, var(--bg-secondary) 0%, transparent 50%);
      pointer-events: none;
      opacity: 0.6;
    }

    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 9999;
      opacity: 0;
      animation: fadeIn 0.4s ease-out forwards 0.1s;
      transition: opacity 0.3s ease;
    }

    #loading-screen.fade-out {
      opacity: 0 !important;
      animation: none;
      pointer-events: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Main container */
    .container {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }

    /* Logo and brand */
    .brand {
      text-align: center;
      margin-bottom: 40px;
      animation: slideDown 0.5s ease-out forwards 0.2s;
      opacity: 0;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      background: var(--surface);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .logo-mark::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .brand-name {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .brand-tagline {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 400;
    }

    /* Main card */
    .card {
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      padding: 32px;
      animation: scaleIn 0.4s ease-out forwards 0.3s;
      opacity: 0;
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Status section */
    .status {
      text-align: center;
      margin-bottom: 32px;
    }

    .status-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .status-message {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Progress bar */
    .progress-wrapper {
      margin-bottom: 28px;
    }

    .progress-track {
      height: 4px;
      background: var(--bg-secondary);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.3),
        transparent
      );
      animation: progressShine 2s infinite;
    }

    @keyframes progressShine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    .progress-fill.complete {
      width: 100% !important;
    }

    .progress-text {
      font-size: 12px;
      color: var(--text-tertiary);
      text-align: center;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .loading-dots {
      display: inline-flex;
      gap: 3px;
    }

    .loading-dots span {
      width: 3px;
      height: 3px;
      background: var(--text-tertiary);
      border-radius: 50%;
      animation: dotBounce 1.4s ease-in-out infinite;
    }

    .loading-dots span:nth-child(1) { animation-delay: 0s; }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotBounce {
      0%, 100% { opacity: 0.3; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }

    /* Features list */
    .features {
      display: grid;
      gap: 12px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--surface-secondary);
      border-radius: 10px;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .feature-item:hover {
      background: var(--bg-secondary);
      transform: translateX(2px);
    }

    .feature-icon {
      width: 32px;
      height: 32px;
      background: var(--accent-light);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .feature-content {
      flex: 1;
      min-width: 0;
    }

    .feature-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .feature-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* Footer note */
    .footer-note {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .footer-text {
      font-size: 12px;
      color: var(--text-tertiary);
      line-height: 1.5;
    }

    .footer-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .footer-link:hover {
      color: var(--accent-hover);
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card {
        padding: 24px;
      }

      .brand {
        margin-bottom: 32px;
      }

      .brand-name {
        font-size: 22px;
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="container">
      <!-- Brand -->
      <div class="brand">
        <div class="logo-mark">📋</div>
        <div class="brand-name">Work Order</div>
        <div class="brand-tagline">Workflow Management</div>
      </div>

      <!-- Main card -->
      <div class="card">
        <!-- Status -->
        <div class="status">
          <h1 class="status-title">Preparing your workspace</h1>
          <p class="status-message">Setting up your work order system</p>
        </div>

        <!-- Progress -->
        <div class="progress-wrapper">
          <div class="progress-track">
            <div id="loading-fill" class="progress-fill"></div>
          </div>
          <div id="progress-text" class="progress-text">
            <span id="progress-percentage">0%</span>
            <div class="loading-dots">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>

        <!-- Features -->
        <div class="features">
          <div class="feature-item">
            <div class="feature-icon">⚡</div>
            <div class="feature-content">
              <div class="feature-title">Real-time updates</div>
              <div class="feature-desc">Instant notifications on order changes</div>
            </div>
          </div>

          <div class="feature-item">
            <div class="feature-icon">🔔</div>
            <div class="feature-content">
              <div class="feature-title">Smart notifications</div>
              <div class="feature-desc">Never miss important updates</div>
            </div>
          </div>

          <div class="feature-item">
            <div class="feature-icon">📊</div>
            <div class="feature-content">
              <div class="feature-title">Analytics dashboard</div>
              <div class="feature-desc">Track performance and insights</div>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div class="footer-note">
          <p class="footer-text">
            Secure • Reliable • Always available
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Simulate loading progress
    (function() {
      var fill = document.getElementById('loading-fill');
      var percentage = document.getElementById('progress-percentage');
      var progress = 0;
      
      var interval = setInterval(function() {
        progress += Math.random() * 12;
        if (progress > 90) progress = 90;
        
        fill.style.width = progress + '%';
        percentage.textContent = Math.round(progress) + '%';
        
        if (progress >= 90) {
          clearInterval(interval);
        }
      }, 180);
    })();

    window.addEventListener('flutter-first-frame', function() {
      var fill = document.getElementById('loading-fill');
      var percentage = document.getElementById('progress-percentage');
      var screen = document.getElementById('loading-screen');
      
      if (fill) {
        fill.style.width = '100%';
        fill.classList.add('complete');
      }
      if (percentage) {
        percentage.textContent = '100%';
      }
      
      setTimeout(function() {
        if (screen) screen.classList.add('fade-out');
        setTimeout(function() {
          if (screen) screen.remove();
        }, 300);
      }, 250);
    });
  </script>

  <script>
    (function() {
      // Event-driven update detection — guarded against loops
      window._swUpdateReady = false;
      window._swUpdateCallback = null;  // single callback, not array
      window._swUpdateApplied = false;  // guard against re-triggering

      function notifyDartUpdateReady() {
        if (window._swUpdateApplied) return;  // already applying, don't re-trigger
        window._swUpdateReady = true;
        if (window._swUpdateCallback) window._swUpdateCallback();
      }

      // Expose function for Dart to register update callback (replaces previous)
      window._registerSwUpdateCallback = function(callback) {
        window._swUpdateCallback = callback;  // replace, don't accumulate
        if (window._swUpdateReady && !window._swUpdateApplied) callback();
      };

      // Track the active SW script URL at page load to detect real changes
      var initialSwUrl = null;
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        initialSwUrl = navigator.serviceWorker.controller.scriptURL;
      }

      if ('serviceWorker' in navigator) {
        // Only detect updates if a SW already controls this page (not first install)
        var hasController = !!navigator.serviceWorker.controller;

        navigator.serviceWorker.ready.then(function(reg) {
          if (reg.waiting && hasController) {
            notifyDartUpdateReady();
            return;
          }
          reg.addEventListener('updatefound', function() {
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', function() {
              if (nw.state === 'installed' && hasController) {
                // Only notify if the new SW is actually waiting (not already activated via skipWaiting)
                if (reg.waiting) {
                  notifyDartUpdateReady();
                }
              } else if (nw.state === 'activated' && hasController) {
                // SW activated via skipWaiting — only notify if it's a genuinely new controller
                if (nw.scriptURL !== initialSwUrl) {
                  notifyDartUpdateReady();
                }
              }
            });
          });
        });
      }

      // Manual check: Dart calls this via JS interop
      window._checkForSwUpdate = function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.ready.then(function(reg) {
            reg.update();
          });
        }
      };

    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    window.applyPWAUpdate = async function() {
      var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var bgColor = isDark ? '#1a1614' : '#f4ede4';
      var textColor = isDark ? '#c9bbb0' : '#6b5d52';
      
      var overlay = document.createElement('div');
      overlay.style.cssText = [
        'position: fixed;',
        'inset: 0;',
        'background: ' + bgColor + ';',
        'display: flex;',
        'flex-direction: column;',
        'align-items: center;',
        'justify-content: center;',
        'z-index: 10000;',
      ].join(' ');

      var container = document.createElement('div');
      container.style.cssText = [
        'display: flex;',
        'flex-direction: column;',
        'align-items: center;',
        'gap: 20px;',
      ].join(' ');

      var dotsContainer = document.createElement('div');
      dotsContainer.style.cssText = [
        'display: flex;',
        'align-items: center;',
        'justify-content: center;',
        'gap: 8px;',
      ].join(' ');

      for (var i = 0; i < 3; i++) {
        var dot = document.createElement('div');
        dot.style.cssText = [
          'width: 8px;',
          'height: 8px;',
          'border-radius: 50%;',
          'background: #cc785c;',
          'animation: pwa-dot-bounce 1.4s ease-in-out infinite;',
          'animation-delay: ' + (i * 0.2) + 's;',
        ].join(' ');
        dotsContainer.appendChild(dot);
      }

      var text = document.createElement('div');
      text.style.cssText = [
        'font-family: Inter, sans-serif;',
        'font-size: 14px;',
        'font-weight: 500;',
        'color: ' + textColor + ';',
      ].join(' ');
      text.textContent = 'Applying update…';

      container.appendChild(dotsContainer);
      container.appendChild(text);
      overlay.appendChild(container);
      document.body.appendChild(overlay);

      await new Promise(function(resolve) { 
        requestAnimationFrame(function() {
          requestAnimationFrame(resolve);
        });
      });

      // Guard against re-triggering
      window._swUpdateApplied = true;

      // With skipWaiting the new SW activates immediately, just wait briefly for caches
      await new Promise(function(resolve) { setTimeout(resolve, 1500); });

      window.location.reload();
    };
  </script>

  <style>
    @keyframes pwa-dot-bounce {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50% { transform: translateY(-8px); opacity: 1; }
    }
  </style>

  <!-- iOS PWA keyboard fix: resize content to match visual viewport -->
  <script>
    (function() {
      if (!window.visualViewport) return;
      var pendingUpdate = false;

      function onViewportChange() {
        if (pendingUpdate) return;
        pendingUpdate = true;
        requestAnimationFrame(function() {
          var vh = window.visualViewport.height;
          var offsetTop = window.visualViewport.offsetTop;
          document.documentElement.style.height = vh + 'px';
          document.body.style.height = vh + 'px';
          // Prevent iOS from scrolling the page behind the keyboard
          if (offsetTop > 0) {
            window.scrollTo(0, 0);
          }
          pendingUpdate = false;
        });
      }

      window.visualViewport.addEventListener('resize', onViewportChange);
      window.visualViewport.addEventListener('scroll', onViewportChange);
    })();
  </script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "760f00e5-fb08-4c0c-b898-ea35737bcc21",
        notifyButton: { enable: false },
        allowLocalhostAsSecureOrigin: true,
        serviceWorkerPath: "OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/" },
      });
    });

    async function oneSignalRequestPermission() {
      return new Promise((resolve) => {
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            const result = await Notification.requestPermission();
            console.log("Notification permission result:", result);
            if (result === "granted") {
              await OneSignal.User.PushSubscription.optIn();
              console.log("OneSignal optIn done, id:", OneSignal.User.PushSubscription.id);
            }
            resolve(result === "granted");
          } catch(e) {
            console.error("Notification permission error:", e);
            resolve(false);
          }
        });
      });
    }

    async function oneSignalSubscribe(email, role) {
      return new Promise((resolve) => {
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            await OneSignal.login(email);
            await OneSignal.User.addTag("role", role);
            resolve(true);
          } catch(e) { resolve(false); }
        });
      });
    }

    async function oneSignalUnsubscribe() {
      return new Promise((resolve) => {
        OneSignalDeferred.push(async function(OneSignal) {
          try { await OneSignal.User.PushSubscription.optOut(); } catch(e) {}
          resolve();
        });
      });
    }

    function setAppBadge(count) {
      if (!('setAppBadge' in navigator)) return;
      if (count > 0) {
        navigator.setAppBadge(count).catch(function(e) {
          console.warn('setAppBadge failed:', e);
        });
      } else {
        navigator.clearAppBadge().catch(function(e) {
          console.warn('clearAppBadge failed:', e);
        });
      }
    }

    OneSignalDeferred.push(function(OneSignal) {
      OneSignal.Notifications.addEventListener('foregroundWillDisplay', function(event) {
        event.notification.display();
        if ('setAppBadge' in navigator) {
          navigator.setAppBadge().catch(function() {});
        }
      });
    });
  </script>
</body>
</html>
