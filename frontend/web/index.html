<!DOCTYPE html>
<html>
<head>
  <script src="webauthn.js"></script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "760f00e5-fb08-4c0c-b898-ea35737bcc21",
        notifyButton: { enable: false },
        allowLocalhostAsSecureOrigin: true,
        serviceWorkerPath: "OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/" },
      });
    });

    async function oneSignalRequestPermission() {
      return new Promise((resolve) => {
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            const result = await Notification.requestPermission();
            console.log("Notification permission result:", result);
            if (result === "granted") {
              await OneSignal.User.PushSubscription.optIn();
              console.log("OneSignal optIn done, id:", OneSignal.User.PushSubscription.id);
            }
            resolve(result === "granted");
          } catch(e) {
            console.error("Notification permission error:", e);
            resolve(false);
          }
        });
      });
    }

    async function oneSignalSubscribe(email, role) {
      return new Promise((resolve) => {
        OneSignalDeferred.push(async function(OneSignal) {
          try {
            await OneSignal.login(email);
            await OneSignal.User.addTag("role", role);
            resolve(true);
          } catch(e) { resolve(false); }
        });
      });
    }

    async function oneSignalUnsubscribe() {
      return new Promise((resolve) => {
        OneSignalDeferred.push(async function(OneSignal) {
          try { await OneSignal.User.PushSubscription.optOut(); } catch(e) {}
          resolve();
        });
      });
    }

    // App icon badge (Web App Badging API — works on installed PWA)
    function setAppBadge(count) {
      if (!('setAppBadge' in navigator)) return;
      if (count > 0) {
        navigator.setAppBadge(count).catch(function(e) {
          console.warn('setAppBadge failed:', e);
        });
      } else {
        navigator.clearAppBadge().catch(function(e) {
          console.warn('clearAppBadge failed:', e);
        });
      }
    }

    // Set badge when a OneSignal notification arrives (foreground)
    OneSignalDeferred.push(function(OneSignal) {
      OneSignal.Notifications.addEventListener('foregroundWillDisplay', function(event) {
        event.notification.display(); // required — without this OneSignal suppresses the notification
        if ('setAppBadge' in navigator) {
          navigator.setAppBadge().catch(function() {});
        }
      });
    });
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-color: #f6f4ef;
      --highlight: #cd7f58;
      --text-dark: #2e1d14;
      --ticket-bg: #f6f2ea;
      --border-color: #cfbeaf;
    }

    body { background: var(--bg-color); }

    /* ── Screen ── */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
      opacity: 0;
      animation: splash-enter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.08s;
      transition: opacity 0.4s ease;
    }
    #loading-screen.fade-out {
      opacity: 0 !important;
      animation: none;
      pointer-events: none;
    }
    @keyframes splash-enter {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Ticket ── */
    #ticket-wrap {
      position: relative;
      width: min(100%, 880px);
      margin: 0 auto;
      padding: 26px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.55);
    }
    .ticket {
      position: relative;
      background: var(--ticket-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 8px 22px rgba(76, 49, 31, 0.1);
    }
    .ticket-content {
      padding: 20px 34px 18px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      margin: 12px;
      gap: 18px;
      position: relative;
      border-radius: 8px;
      background-image: radial-gradient(circle at 20% 25%, rgba(255,255,255,0.5), rgba(255,255,255,0) 42%), radial-gradient(circle at 80% 75%, rgba(255,255,255,0.4), rgba(255,255,255,0) 38%);
    }
    .ticket-edge {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 2px;
      font-weight: 800;
      color: #8e6f5d;
      text-align: center;
      text-transform: uppercase;
    }
    .ticket-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .ticket-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .logo { color: var(--highlight); font-size: clamp(44px, 8vw, 66px); margin-bottom: 0; line-height: 1; }
    .ticket-title {
      font-family: 'Inter', sans-serif;
      font-size: clamp(40px, 7vw, 4.6rem);
      font-weight: 800;
      color: var(--text-dark);
      margin: 0;
      letter-spacing: -1.2px;
    }
    .ticket-subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(22px, 3.1vw, 2.5rem);
      color: #7a5744;
      margin-top: 2px;
    }
    .ticket-icon { font-size: clamp(42px, 7vw, 62px); text-align: center; line-height: 1; }
    .side-label {
      position: absolute;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 2px;
      font-weight: 800;
      color: #8e6f5d;
      top: 50%;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .side-label.left  { left: -48px;  transform: translateY(-50%) rotate(-90deg); }
    .side-label.right { right: -48px; transform: translateY(-50%) rotate(90deg); }

    /* ── Progress bar ── */
    #loading-track {
      width: min(320px, 65%);
      height: 3px;
      background: rgba(139, 103, 81, 0.12);
      border-radius: 100px;
      margin: 6px auto 0;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(46, 29, 20, 0.04);
    }
    #loading-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--highlight) 0%, #cd9375 100%);
      border-radius: 100px;
      width: 0%;
      animation: loading-auto 7.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    #loading-fill.complete {
      animation: none;
      width: 100% !important;
      transition: width 0.15s ease;
    }
    @keyframes loading-auto {
      0%   { width: 0%; }
      30%  { width: 55%; }
      60%  { width: 75%; }
      100% { width: 88%; }
    }

    @media (max-width: 680px) {
      #ticket-wrap { padding: 10px; }
      .ticket-content { padding: 14px 14px 12px; gap: 10px; }
      .ticket-edge { font-size: 0.62rem; letter-spacing: 1.3px; }
      .side-label { display: none; }
      #loading-track { width: min(300px, 86%); }
    }

    /* ── PWA update dots animation ── */
    @keyframes pwa-dot-bounce {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div id="ticket-wrap">
      <div class="ticket">
        <div class="ticket-content">
          <div class="ticket-edge top">Please wait &nbsp;•&nbsp; now loading: WORK ORDER SYSTEM</div>

          <div class="ticket-center">
            <div class="ticket-brand">
              <div class="logo">✱</div>
              <h2 class="ticket-title">Work Order</h2>
            </div>
            <p class="ticket-subtitle">Immediate workflow access</p>
          </div>

          <div class="ticket-icon">💼</div>

          <div id="loading-track"><div id="loading-fill"></div></div>

          <div class="ticket-edge bottom">Please wait &nbsp;•&nbsp; now Loading: WORK ORDER SYSTEM</div>

          <div class="side-label left">0000001 · CLICK HERE</div>
          <div class="side-label right">CLICK HERE · 0000001</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var fill   = document.getElementById('loading-fill');
      var screen = document.getElementById('loading-screen');
      if (fill) fill.classList.add('complete');
      setTimeout(function() {
        if (screen) screen.classList.add('fade-out');
        setTimeout(function() {
          if (screen) screen.remove();
        }, 380);
      }, 180);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    (function() {
      var flutterCleanupKey = 'flutter_sw_cleanup_done_v2';

      function loadFlutter() {
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js';
        script.async = true;
        document.body.appendChild(script);
      }

      function isFlutterServiceWorkerRegistration(reg) {
        var workers = [reg.active, reg.waiting, reg.installing];
        for (var i = 0; i < workers.length; i++) {
          var worker = workers[i];
          if (worker && worker.scriptURL && worker.scriptURL.indexOf('flutter_service_worker.js') !== -1) {
            return true;
          }
        }
        return false;
      }

      async function cleanupLegacyServiceWorker() {
        if (!('serviceWorker' in navigator)) return false;
        if (localStorage.getItem(flutterCleanupKey) === '1') return false;

        try {
          var regs = await navigator.serviceWorker.getRegistrations();
          var flutterRegs = regs.filter(isFlutterServiceWorkerRegistration);
          if (!flutterRegs.length) {
            localStorage.setItem(flutterCleanupKey, '1');
            return false;
          }

          var removedAny = false;
          await Promise.all(flutterRegs.map(async function(reg) {
            var removed = await reg.unregister();
            if (removed) removedAny = true;
          }));

          localStorage.setItem(flutterCleanupKey, '1');
          if (!removedAny) return false;
          var url = new URL(window.location.href);
          url.searchParams.set('swreset', String(Date.now()));
          window.location.replace(url.toString());
          return true;
        } catch (_) {
          return false;
        }
      }

      cleanupLegacyServiceWorker().then(function(reloaded) {
        if (!reloaded) loadFlutter();
      });
    })();
  </script>

  <script>
    // Called by Flutter's "Update now" button.
    // Unregisters Flutter service workers and reloads once.
    window.applyPWAUpdate = async function() {
      var overlay = document.createElement('div');
      overlay.style.cssText = [
        'position: fixed;',
        'inset: 0;',
        'background: rgba(246, 244, 239, 0.92);',
        'display: flex;',
        'flex-direction: column;',
        'align-items: center;',
        'justify-content: center;',
        'z-index: 10000;',
      ].join(' ');

      // Container for dots and text
      var container = document.createElement('div');
      container.style.cssText = [
        'display: flex;',
        'flex-direction: column;',
        'align-items: center;',
        'gap: 16px;',
      ].join(' ');

      // Dots container
      var dotsContainer = document.createElement('div');
      dotsContainer.style.cssText = [
        'display: flex;',
        'align-items: center;',
        'justify-content: center;',
      ].join(' ');

      // Create 3 animated dots with staggered delays and explicit margins
      for (var i = 0; i < 3; i++) {
        var dot = document.createElement('div');
        var dotStyle = [
          'width: 8px;',
          'height: 8px;',
          'border-radius: 50%;',
          'background: #CC785C;',
          'animation: pwa-dot-bounce 1.2s ease-in-out infinite;',
          'animation-delay: ' + (i * 0.4) + 's;',
        ];
        // Use explicit margin instead of gap
        if (i === 0) {
          dotStyle.push('margin-right: 8px;');
        } else if (i === 1) {
          dotStyle.push('margin-left: 0;');
          dotStyle.push('margin-right: 8px;');
        } else {
          dotStyle.push('margin-left: 0;');
        }
        dot.style.cssText = dotStyle.join(' ');
        dotsContainer.appendChild(dot);
      }

      // Text with percentage
      var text = document.createElement('div');
      text.style.cssText = [
        'font-family: Inter, sans-serif;',
        'font-size: 14px;',
        'font-weight: 500;',
        'color: #2e1d14;',
        'letter-spacing: -0.01em;',
      ].join(' ');
      text.textContent = 'Applying update… 0%';

      container.appendChild(dotsContainer);
      container.appendChild(text);
      overlay.appendChild(container);
      document.body.appendChild(overlay);

      // Force browser to paint and show initial state
      await new Promise(function(resolve) { 
        requestAnimationFrame(function() {
          requestAnimationFrame(resolve);
        });
      });

      // Helper function to update progress with increment animation
      function updateProgress(targetPercent, durationMs) {
        return new Promise(function(resolve) {
          var currentPercent = parseInt(text.textContent.match(/\d+/)[0]) || 0;
          var steps = targetPercent - currentPercent;
          if (steps <= 0) {
            resolve();
            return;
          }
          
          var stepDuration = durationMs / steps;
          var currentStep = 0;
          
          var interval = setInterval(function() {
            currentStep++;
            var newPercent = currentPercent + currentStep;
            text.textContent = 'Applying update… ' + newPercent + '%';
            
            if (currentStep >= steps) {
              clearInterval(interval);
              resolve();
            }
          }, stepDuration);
        });
      }

      // Phase 1: 0% → 45% (prepare for service worker cleanup)
      await updateProgress(45, 1800);

      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          const flutterRegistrations = registrations.filter(function(reg) {
            const workers = [reg.active, reg.waiting, reg.installing];
            return workers.some(function(worker) {
              return worker && worker.scriptURL &&
                  worker.scriptURL.indexOf('flutter_service_worker.js') !== -1;
            });
          });
          
          // Phase 2: 45% → 75% (during unregistration)
          var unregisterPromise = Promise.all(flutterRegistrations.map(function(reg) {
            return reg.unregister();
          }));
          
          await Promise.all([
            unregisterPromise,
            updateProgress(75, 1200)
          ]);
        }
      } catch (_) {
        // Fall through to reload.
      }
      
      // Phase 3: 75% → 100% (finalizing)
      await updateProgress(100, 1000);
      
      // Brief pause at 100% before reload
      await new Promise(function(resolve) { setTimeout(resolve, 200); });
      
      const finalTs = Date.now();
      const finalUrl = new URL(window.location.href);
      finalUrl.searchParams.set('refresh', String(finalTs));
      window.location.replace(finalUrl.toString());
    };
  </script>
