server {
    listen 80;
    server_name 100.85.73.37;

    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/octet-stream
        font/ttf
        font/woff
        font/woff2
        image/svg+xml;

    root /var/www/flutter_app;
    index index.html;

    # FILE DOWNLOADS
    location /files/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # API – never cache responses
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        
        if ($request_method = "OPTIONS") {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "*" always;
            add_header Content-Length 0;
            return 204;
        }
    }

    # Never cache Flutter's entry-point files
    location ~* (flutter_service_worker\.js|flutter_bootstrap\.js|flutter\.js|main\.dart\.js|index\.html|manifest\.json|release\.json|AssetManifest\.json|AssetManifest\.bin\.json|FontManifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    # Long cache for versioned/hashed static assets
    location ~* \.(js|css|ico|svg|woff|woff2|ttf)$ {
        expires 6M;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # FLUTTER SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
