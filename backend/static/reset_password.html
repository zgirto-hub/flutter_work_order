<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Work Order</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d0d;
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container { max-width: 400px; width: 100%; }
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 14px;
            padding: 32px 28px;
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }
        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            color: #888;
            margin-bottom: 6px;
        }
        .input-wrapper {
            position: relative;
            margin-bottom: 16px;
        }
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 10px 40px 10px 12px;
            background: #111;
            border: 1px solid #333;
            border-radius: 9px;
            color: #e5e5e5;
            font-size: 13px;
            outline: none;
        }
        input:focus { border-color: #3b82f6; }
        .toggle-eye {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
        }
        .toggle-eye:hover { color: #aaa; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover:not(:disabled) { opacity: 0.9; }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 16px;
            display: none;
        }
        .message.error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
        }
        .message.success {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Reset Password</h1>
            <p class="subtitle">Enter your new password below.</p>

            <div id="message" class="message"></div>

            <form id="resetForm">
                <label for="password">New Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter new password" required minlength="6">
                    <button type="button" class="toggle-eye" onclick="toggleVis('password', this)">&#128065;</button>
                </div>

                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                    <button type="button" class="toggle-eye" onclick="toggleVis('confirmPassword', this)">&#128065;</button>
                </div>

                <button type="submit" class="btn btn-primary" id="submitBtn">Reset Password</button>
            </form>
        </div>
    </div>

    <script>
        var tokenData = {};

        (function init() {
            // Supabase redirects with token_hash in query params (default flow)
            var queryParams = new URLSearchParams(window.location.search);
            var tokenHash = queryParams.get('token_hash');
            var queryType = queryParams.get('type');

            // Legacy: access_token in hash fragment
            var hashParams = new URLSearchParams(window.location.hash.substring(1));
            var accessToken = hashParams.get('access_token');
            var hashType = hashParams.get('type');

            if (tokenHash && queryType === 'recovery') {
                tokenData = { token_hash: tokenHash, type: 'recovery' };
            } else if (accessToken && hashType === 'recovery') {
                tokenData = { access_token: accessToken };
            } else {
                showMessage('Invalid or expired reset link. Please request a new one from the app.', 'error');
                document.getElementById('resetForm').style.display = 'none';
            }
        })();

        function showMessage(text, type) {
            var msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
        }

        function toggleVis(inputId, btn) {
            var input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.style.opacity = '1';
            } else {
                input.type = 'password';
                btn.style.opacity = '0.6';
            }
        }

        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var submitBtn = document.getElementById('submitBtn');

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters.', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showMessage('Passwords do not match.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';

            var body = Object.assign({}, tokenData, { new_password: password });

            fetch('/api/users/complete-password-reset', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(function(res) {
                return res.json().then(function(data) { return { ok: res.ok, data: data }; });
            })
            .then(function(result) {
                if (result.ok) {
                    showMessage('Password updated successfully! You can now sign in with your new password.', 'success');
                    document.getElementById('resetForm').style.display = 'none';
                } else {
                    showMessage(result.data.detail || 'Failed to reset password.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset Password';
                }
            })
            .catch(function() {
                showMessage('Network error. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            });
        });
    </script>
</body>
</html>
